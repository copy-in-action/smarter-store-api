name: Deploy Smarter Store API

on:
  push:
    branches:
      - main
  # 수동 실행을 위해 추가
  workflow_dispatch:

env:
  # Docker Hub 사용자 이름으로 이미지 경로 설정 (Secrets 참조)
  DOCKER_IMAGE_PATH: ${{ secrets.DOCKER_USERNAME }}/smarter-store-api

jobs:
  build-and-push:
    # 빌드는 GitHub-hosted runner (AMD64)에서 수행
    runs-on: ubuntu-latest
    # Job Output은 보안 경고를 피하기 위해 제거됨

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Commit Message
        id: commit
        run: |
          # 이전 커밋 해시 (Push 이벤트)
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          
          # before가 없거나 000...인 경우 (최초 푸시, 수동 실행 등)
          if [ -z "$BEFORE" ] || [ "$BEFORE" == "0000000000000000000000000000000000000000" ]; then
             # 최근 5개 커밋만 표시
             MSG=$(git log -5 --pretty=format:"• %s")
          else
             # 변경된 범위의 커밋 목록 표시
             MSG=$(git log $BEFORE..$AFTER --pretty=format:"• %s")
          fi
          
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Notify Slack on Start
        env:
          COMMIT_MSG: ${{ steps.commit.outputs.message }}
        run: |
          # 커밋 메시지의 개행 문자 등을 JSON 안전하게 처리
          ESCAPED_MSG=$(echo "$COMMIT_MSG" | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"text\": \"🚀 *배포 시작*\",
              \"attachments\": [{
                \"color\": \"#439FE0\",
                \"fields\": [
                  {\"title\": \"Repository\", \"value\": \"${{ github.repository }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Author\", \"value\": \"${{ github.actor }}\", \"short\": true},
                  {\"title\": \"Changes\", \"value\": \"$ESCAPED_MSG\", \"short\": false}
                ]
              }]
            }" \
            ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        # 테스트는 제외하고 JAR 파일만 빌드
        run: ./gradlew clean build -x test

      - name: Set Docker Tags
        id: set_tags
        run: |
          # Git SHA 태그와 latest 태그 정의
          echo "SHA_TAG=${{ env.DOCKER_IMAGE_PATH }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=${{ env.DOCKER_IMAGE_PATH }}:latest" >> "$GITHUB_OUTPUT"

      # 📌 변경됨: Multi-Arch 빌드를 위한 설정 시작
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image (Multi-Arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.set_tags.outputs.SHA_TAG }}
            ${{ steps.set_tags.outputs.LATEST_TAG }}
          # 📌 중요: 대상 플랫폼을 linux/arm64로 지정하여 Raspberry Pi/Orange Pi 환경에 맞춤
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 📌 Multi-Arch 빌드를 위한 설정 끝

  deploy:
    # 📌 배포 서버에 설치된 self-hosted runner에서 실행
    runs-on: self-hosted
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Hub Login (on self-hosted runner)
        # 배포 서버(self-hosted runner)에서 Docker Hub에 로그인
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Deploy with Docker Compose
        env:
          DOCKER_IMAGE_PATH: ${{ env.DOCKER_IMAGE_PATH }}
          JWT_SECRET_PROD: ${{ secrets.JWT_SECRET_PROD }}
          SPRING_DATASOURCE_URL: ${{ secrets.PROD_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          PROD_DB_USERNAME: ${{ secrets.PROD_DB_USERNAME }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          SPRING_MAIL_USERNAME: ${{ secrets.SPRING_MAIL_USERNAME }}
          SPRING_MAIL_PASSWORD: ${{ secrets.SPRING_MAIL_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_DEPLOY: ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}
          ENCRYPTION_SECRET_PROD: ${{ secrets.ENCRYPTION_SECRET_PROD }}
          # 데모 데이터 시딩 활성화 (서버 docker-compose.yml의 ticket-be environment에 동일 변수 전달 필요)
          DEMO_SEED_ENABLED: 'true'
        run: |
          # 1. 관리 경로로 이동
          cd ${{ vars.DOCKER_COMPOSE_PATH }}
          
          # 2. 기존 서비스 정리
          docker compose down ticket-be || true
          
          # 3. 최신 이미지 pull 및 ticket-be 재시작
          docker compose pull ticket-be
          docker compose up -d ticket-be
          
          # 4. 사용하지 않는 Docker 이미지 정리
          docker image prune -f

      - name: Notify Slack on Success
        if: success()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text": "✅ *배포 완료*"}' \
            ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}

      - name: Notify Slack on Failure
        if: failure()
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{
              "text": "❌ *배포 실패*\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>"
            }' \
            ${{ secrets.SLACK_WEBHOOK_URL_DEPLOY }}