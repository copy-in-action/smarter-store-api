version: '3.8'

  services:
    postgres:
      image: postgres:18
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER:-postgres}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
        POSTGRES_DB: ${POSTGRES_DB:-myapp}
        TZ: Asia/Seoul
      ports:
        - "${POSTGRES_PORT:-5432}:5432"
      volumes:
        - postgres_data:/var/lib/postgresql
        #- ./init-scripts:/docker-entrypoint-initdb.d  # 초기화 SQL 스크립트 (선택사항)
      networks:
        - network
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
        interval: 10s
        timeout: 5s
        retries: 5

    ticket-fe:
      image: ticket-fe
      container_name: ticket-fe
      ports:
        - "43000:3000"  # 호스트:43000 → 컨테이너:3000
      environment:
        - NODE_ENV=production
        - PORT=3000
        - HOSTNAME=0.0.0.0
      restart: unless-stopped
      networks:
        - network  # 다른 서비스와 통신 필요시

    ticket-be:
      image: ${DOCKER_IMAGE_PATH:-smarter-store-api}:latest
      container_name: ticket-be
      restart: always
      ports:
        - "48080:8080"  # 호스트:48080 → 컨테이너:8080
      environment:
        - SPRING_PROFILES_ACTIVE=prod
        - TZ=Asia/Seoul
        - JWT_SECRET_PROD=${JWT_SECRET_PROD}
        - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
        - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
        - PROD_DB_URL=${PROD_DB_URL}
        - PROD_DB_USERNAME=${PROD_DB_USERNAME}
        - PROD_DB_PASSWORD=${PROD_DB_PASSWORD}
        - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
        - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
        - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
        - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
        - SLACK_WEBHOOK_URL_DEPLOY=${SLACK_WEBHOOK_URL_DEPLOY}
        - ENCRYPTION_SECRET_PROD=${ENCRYPTION_SECRET_PROD}
      volumes:
        - /home/cic/docker/logs/smarter-store-api:/app/logs
      networks:
        - network
      depends_on:
        postgres:
          condition: service_healthy

    # ===== 모니터링 스택 =====
    prometheus:
      image: prom/prometheus:latest
      container_name: prometheus
      environment:
        - TZ=Asia/Seoul
      volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus_data:/prometheus
      command:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--storage.tsdb.retention.time=15d'
        - '--web.enable-lifecycle'
      restart: unless-stopped
      networks:
        - network

    grafana:
      image: grafana/grafana:latest
      container_name: grafana
      ports:
        - "43001:3000"
      environment:
        - TZ=Asia/Seoul
        - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
        - GF_USERS_ALLOW_SIGN_UP=false
      volumes:
        - grafana_data:/var/lib/grafana
        - ./grafana/provisioning:/etc/grafana/provisioning:ro
      restart: unless-stopped
      networks:
        - network
      depends_on:
        - prometheus
        - loki

    # ===== 로그 스택 =====
    loki:
      image: grafana/loki:latest
      container_name: loki
      environment:
        - TZ=Asia/Seoul
      volumes:
        - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
        - loki_data:/loki
      command: -config.file=/etc/loki/local-config.yaml
      restart: unless-stopped
      networks:
        - network

    promtail:
      image: grafana/promtail:latest
      container_name: promtail
      environment:
        - TZ=Asia/Seoul
      volumes:
        - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - /var/run/docker.sock:/var/run/docker.sock
      command: -config.file=/etc/promtail/config.yml
      restart: unless-stopped
      networks:
        - network
      depends_on:
        - loki

  volumes:
    postgres_data:
      driver: local
    prometheus_data:
      driver: local
    grafana_data:
      driver: local
    loki_data:
      driver: local

  networks:
    network:
      driver: bridge