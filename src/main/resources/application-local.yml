spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
logging:
  file:
    path: ./logs/smarter-store-local/
  level:
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET_LOCAL}

encryption:
  secret-key: ${ENCRYPTION_SECRET_LOCAL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

app:
  frontend-url: http://localhost:3000

# 로컬에서 데모 시딩을 확인하려면 .env 또는 환경변수에 DEMO_SEED_ENABLED=true 를 지정하거나 아래 주석을 해제
# demo:
#   seed:
#     enabled: true
