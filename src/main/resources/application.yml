spring:
  application:
    name: smarter-store-api
  profiles:
    active: local
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-SmarterStore
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  access-token-validity-in-seconds: 3600
  refresh-token-validity-in-seconds: 604800

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: true

app:
  cookie:
    domain: .devhong.cc

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

migration:
  encrypt-phone-number: false  # true로 변경하면 서버 시작 시 기존 전화번호 암호화

slack: #SlackServiceTest 를 위해 공통환경변수 설정.
  webhook-url-deploy: ${SLACK_WEBHOOK_URL_DEPLOY:http://localhost}

# 데모 데이터 시딩 (배포 서버는 prod 프로파일이므로 @Profile 대신 프로퍼티로 제어)
demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:false}
    rolling-days: ${DEMO_SEED_ROLLING_DAYS:56}
    rolling-cron: ${DEMO_SEED_ROLLING_CRON:0 0 3 * * MON}
    cleanup-cron: ${DEMO_SEED_CLEANUP_CRON:0 30 4 * * *}
    demo-user-reset-cron: ${DEMO_SEED_USER_RESET_CRON:0 0 4 * * *}
    retention-days: ${DEMO_SEED_RETENTION_DAYS:14}
    simulator-enabled: ${DEMO_SEED_SIMULATOR_ENABLED:true}
    simulator-interval-ms: ${DEMO_SEED_SIMULATOR_INTERVAL_MS:5000}
    demo-user-password: ${DEMO_USER_PASSWORD:DemoPass1234!}
    bot-user-password: ${DEMO_BOT_PASSWORD:BotInternalPass1234!}
    max-seats-per-schedule: ${DEMO_SEED_MAX_SEATS_PER_SCHEDULE:220}
